# Sobe o MySQL 8 e o MongoDB do FinCore.
# Uso:   docker compose up -d
# Parar: docker compose down          (mantém os dados)
# Zerar: docker compose down -v       (apaga os bancos e os scripts rodam de novo)
services:
  mysql:
    image: mysql:8.0
    container_name: fincore-mysql
    restart: unless-stopped
    environment:
      # A senha do root vem do arquivo .env (que não vai para o Git).
      # O root só serve para montar o banco; a aplicação usa o app_fincore.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Senhas dos usuários do MySQL criados pelo 04_usuarios_acesso (também do .env).
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ANALISTA_PASSWORD: ${DB_ANALISTA_PASSWORD}
      DB_DBA_PASSWORD: ${DB_DBA_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      # 3307 no seu PC -> 3306 no container (evita conflito com um MySQL já instalado)
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts rodam só na PRIMEIRA criação do banco, em ordem alfabética.
      # O 03_consultas.sql fica de fora de propósito (altera dados e é só para demonstração).
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_dados.sql:/docker-entrypoint-initdb.d/02_dados.sql:ro
      # 04: o .sh troca as marcas de senha pelas do .env e roda o .sql.
      # O .sql fica em outra pasta para o Docker não rodá-lo sozinho (sem as senhas).
      - ./sql/04_usuarios_acesso.sh:/docker-entrypoint-initdb.d/04_usuarios_acesso.sh:ro
      - ./sql/04_usuarios_acesso.sql:/fincore-sql/04_usuarios_acesso.sql:ro
      - ./sql/05_funcoes_id.sql:/docker-entrypoint-initdb.d/05_funcoes_id.sql:ro
      - ./sql/06_views.sql:/docker-entrypoint-initdb.d/06_views.sql:ro
      - ./sql/07_triggers_procedures.sql:/docker-entrypoint-initdb.d/07_triggers_procedures.sql:ro
      # Os scripts de demonstração (06b, 07b) ficam de fora: são para rodar na apresentação.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NoSQL (recurso opcional): guarda o log de auditoria (login e transferências)
  mongo:
    image: mongo:7
    container_name: fincore-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mysql-data:
  mongo-data: